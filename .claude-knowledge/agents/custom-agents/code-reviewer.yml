---
# Агент для автоматического code review
agent:
  name: "code-reviewer"
  version: "1.3.0"
  description: "Автоматически проверяет код на качество, безопасность и соответствие best practices"
  author: "Claude Knowledge System"
  created: "2026-01-10"
  updated: "2026-02-09"
  license: "MIT"

metadata:
  category: "code-quality"
  language: "multi"
  difficulty: "intermediate"
  maturity: "stable"
  tags:
    - code-review
    - static-analysis
    - best-practices
    - security
    - quality
  supported_languages:
    - python
    - javascript
    - typescript
    - java
    - go
    - rust

capabilities:
  - analyze_code_quality
  - detect_code_smells
  - find_security_issues
  - suggest_refactoring
  - check_best_practices
  - generate_detailed_reports
  - provide_examples
  - estimate_complexity

# Параметры агента
parameters:
  file_path:
    type: string
    required: true
    description: "Путь к файлу для анализа"
    validation:
      pattern: "^[\\w\\-./]+\\.(py|js|ts|java|go|rs)$"
    example: "src/main.py"

  language:
    type: string
    required: false
    default: "auto"
    allowed_values:
      - auto
      - python
      - javascript
      - typescript
      - java
      - go
      - rust
    description: "Язык программирования (auto для автоопределения)"

  strictness:
    type: string
    required: false
    default: "medium"
    allowed_values:
      - low      # Только критичные проблемы
      - medium   # Стандартные проверки
      - high     # Строгие проверки всего
      - pedantic # Максимально строгие проверки
    description: "Уровень строгости проверок"

  check_types:
    type: array
    required: false
    default: ["all"]
    allowed_values:
      - all
      - style
      - bugs
      - security
      - performance
      - complexity
      - documentation
    description: "Типы проверок для выполнения"

  output_format:
    type: string
    required: false
    default: "markdown"
    allowed_values:
      - markdown
      - json
      - console
      - html
    description: "Формат выходного отчета"

  include_fixes:
    type: boolean
    required: false
    default: true
    description: "Включить предложения по исправлению"

  max_issues:
    type: integer
    required: false
    default: 50
    description: "Максимальное количество issues в отчете"
    validation:
      min: 1
      max: 1000

# Инструменты которые использует агент
dependencies:
  tools:
    - Read       # Чтение файлов
    - Grep       # Поиск паттернов
    - Bash       # Запуск линтеров
    - Write      # Создание отчетов

  external_optional:
    python:
      - name: "pylint"
        version: ">=2.17.0"
        install: "pip install pylint"
      - name: "flake8"
        version: ">=6.0.0"
        install: "pip install flake8"
      - name: "mypy"
        version: ">=1.0.0"
        install: "pip install mypy"

    javascript:
      - name: "eslint"
        version: ">=8.0.0"
        install: "npm install -g eslint"
      - name: "prettier"
        version: ">=3.0.0"
        install: "npm install -g prettier"

    typescript:
      - name: "typescript"
        version: ">=5.0.0"
        install: "npm install -g typescript"

# Системный промпт для агента
prompts:
  system: |
    Вы - опытный code reviewer с экспертизой в:
    - Чистом коде и best practices
    - Обнаружении багов и уязвимостей
    - Оптимизации производительности
    - Архитектурных паттернах

    Ваша задача:
    1. Тщательно проанализировать предоставленный код
    2. Найти проблемы разных уровней критичности
    3. Предложить конкретные улучшения с примерами
    4. Объяснить почему это важно

    Будьте:
    - Конструктивным и полезным
    - Конкретным в рекомендациях
    - Объективным в оценках
    - Обучающим в объяснениях

  task_template: |
    Проанализируй код в файле: ${file_path}

    Параметры анализа:
    - Язык: ${language}
    - Строгость: ${strictness}
    - Проверки: ${check_types}

    Выполни следующие проверки:

    1. 🎨 СТИЛЬ И ЧИТАЕМОСТЬ
       - Соответствие стандартам кодирования
       - Именование переменных и функций
       - Структура и организация кода
       - Комментарии и документация

    2. 🐛 ПОТЕНЦИАЛЬНЫЕ БАГИ
       - Логические ошибки
       - Edge cases
       - Null/undefined проверки
       - Error handling

    3. 🔒 БЕЗОПАСНОСТЬ
       - SQL injection
       - XSS уязвимости
       - Небезопасное использование eval
       - Утечки данных
       - Hardcoded секреты

    4. ⚡ ПРОИЗВОДИТЕЛЬНОСТЬ
       - O(n) сложность алгоритмов
       - Неэффективные циклы
       - Избыточные вычисления
       - Утечки памяти

    5. 🏗️ АРХИТЕКТУРА
       - Принципы SOLID
       - DRY violations
       - Coupling и cohesion
       - Паттерны проектирования

    6. 📊 СЛОЖНОСТЬ
       - Cyclomatic complexity
       - Глубина вложенности
       - Длина функций
       - Количество параметров

    Для каждой найденной проблемы предоставь:
    - 📍 Местоположение (строка)
    - 🎯 Описание проблемы
    - 🔴 Уровень критичности (critical/high/medium/low)
    - 💡 Рекомендации по исправлению
    - ✨ Пример исправленного кода (если ${include_fixes})

    Формат отчета: ${output_format}

# Workflow агента
workflow:
  - step: "detect_language"
    name: "Определение языка"
    action: "Автоопределение языка если не указан"
    condition: "language == 'auto'"

  - step: "read_file"
    name: "Чтение файла"
    action: "Загрузка содержимого файла"
    tools: [Read]
    error_handling: "abort_on_error"

  - step: "static_analysis"
    name: "Статический анализ"
    action: "Анализ кода встроенными средствами"
    tools: [Read, Grep]

  - step: "external_linters"
    name: "Внешние линтеры"
    action: "Запуск внешних инструментов если доступны"
    tools: [Bash]
    error_handling: "continue_on_error"
    optional: true

  - step: "analyze_patterns"
    name: "Анализ паттернов"
    action: "Поиск антипаттернов и code smells"
    tools: [Read, Grep]

  - step: "security_check"
    name: "Проверка безопасности"
    action: "Поиск уязвимостей"
    tools: [Grep]

  - step: "complexity_analysis"
    name: "Анализ сложности"
    action: "Оценка сложности кода"

  - step: "generate_report"
    name: "Генерация отчета"
    action: "Создание финального отчета"
    tools: [Write]
    output_format: "${output_format}"

  - step: "provide_summary"
    name: "Резюме"
    action: "Краткое резюме с оценкой"

# Примеры использования
examples:
  - name: "Базовый анализ Python файла"
    description: "Стандартная проверка Python кода"
    input:
      file_path: "src/api/auth.py"
      language: "python"
      strictness: "medium"
    expected_output: |
      # Code Review Report: src/api/auth.py

      ## Summary
      - Total Issues: 5
      - Critical: 1
      - High: 2
      - Medium: 2
      - Overall Grade: B

      ## Critical Issues
      ...

  - name: "Строгая проверка TypeScript"
    description: "Педантичная проверка всех аспектов"
    input:
      file_path: "src/components/Button.tsx"
      language: "typescript"
      strictness: "pedantic"
      check_types: ["all"]
    expected_output: |
      Found 12 issues requiring attention...

  - name: "Только проверка безопасности"
    description: "Фокус на security issues"
    input:
      file_path: "src/db/queries.js"
      language: "javascript"
      check_types: ["security"]
      strictness: "high"
    expected_output: |
      🔒 Security Analysis
      - Found 2 critical vulnerabilities
      - SQL injection risk detected
      ...

  - name: "JSON отчет для CI/CD"
    description: "Структурированный вывод для автоматизации"
    input:
      file_path: "main.go"
      language: "go"
      output_format: "json"
    expected_output_schema:
      file: "main.go"
      language: "go"
      issues: []
      metrics: {}
      grade: "A"

# Обработка ошибок
error_handling:
  file_not_found:
    message: "Файл не найден: ${file_path}"
    action: "abort"
    exit_code: 1

  unsupported_language:
    message: "Язык ${language} не поддерживается"
    action: "abort"
    suggestion: "Supported: python, javascript, typescript, java, go, rust"

  syntax_error:
    message: "Синтаксическая ошибка в файле"
    action: "report_and_continue"
    severity: "high"

  tool_not_available:
    message: "Инструмент ${tool_name} недоступен"
    action: "use_fallback"
    severity: "low"

  timeout:
    message: "Анализ превысил лимит времени"
    timeout_seconds: 300
    action: "abort"

# Настройки производительности
performance:
  max_file_size_mb: 5
  timeout_seconds: 300
  cache_results: true
  cache_duration_hours: 1
  parallel_checks: true

# Интеграция с Claude Code
integration:
  claude_code:
    command: "/review"
    aliases:
      - "/code-review"
      - "/analyze"
      - "/check"
    auto_trigger:
      on_save: false
      on_commit: false
      on_pr: true
    keyboard_shortcut: "Ctrl+Shift+R"

  mcp:
    protocol_version: "1.0"
    capabilities:
      - file_read
      - tool_execution
      - report_generation

  github:
    pr_comments: true
    inline_suggestions: true
    status_checks: true

# Конфигурации по языкам
language_configs:
  python:
    style_guide: "PEP 8"
    max_line_length: 88
    max_function_lines: 50
    max_complexity: 10

  javascript:
    style_guide: "Airbnb"
    max_line_length: 100
    max_function_lines: 40
    max_complexity: 8

  typescript:
    strict_mode: true
    no_any: true
    max_line_length: 100

# Правила для различных уровней строгости
strictness_rules:
  low:
    - syntax_errors
    - critical_bugs
    - security_critical

  medium:
    - syntax_errors
    - bugs
    - security
    - major_code_smells

  high:
    - syntax_errors
    - bugs
    - security
    - code_smells
    - style_violations
    - complexity

  pedantic:
    - all_checks
    - strict_typing
    - documentation_required
    - test_coverage
    - no_warnings

# Метрики качества
quality_metrics:
  grade_thresholds:
    A:
      max_issues: 2
      max_critical: 0
      max_high: 1
    B:
      max_issues: 5
      max_critical: 1
      max_high: 2
    C:
      max_issues: 10
      max_critical: 2
      max_high: 4
    D:
      max_issues: 20
      max_critical: 3
      max_high: 8
    F:
      max_issues: ">20"

# Шаблон отчета
report_template: |
  # 📊 Code Review Report

  **File**: ${file_path}
  **Language**: ${language}
  **Reviewed**: ${timestamp}
  **Grade**: ${grade}

  ## 📈 Summary

  | Metric | Value |
  |--------|-------|
  | Total Issues | ${total_issues} |
  | Critical | ${critical_count} |
  | High | ${high_count} |
  | Medium | ${medium_count} |
  | Low | ${low_count} |

  ## 🎯 Key Metrics

  - Lines of Code: ${loc}
  - Complexity Score: ${complexity}
  - Maintainability Index: ${maintainability}

  ## 🔴 Issues

  ${issues_list}

  ## ✨ Recommendations

  ${recommendations}

  ## 📚 Additional Notes

  ${notes}

  ---
  Generated by Code Reviewer Agent v${version}

# Тестирование агента
tests:
  - name: "Test Python file analysis"
    input:
      file_path: "tests/fixtures/sample.py"
      language: "python"
      strictness: "medium"
    expected:
      issues_found: true
      report_generated: true
      exit_code: 0

  - name: "Test invalid file"
    input:
      file_path: "nonexistent.py"
    expected:
      error: "file_not_found"
      exit_code: 1

# История изменений
changelog:
  - version: "1.3.0"
    date: "2026-02-09"
    changes:
      - "Добавлена поддержка Rust"
      - "Улучшена проверка безопасности"
      - "Оптимизирована производительность"

  - version: "1.2.0"
    date: "2026-01-20"
    changes:
      - "Добавлен JSON формат отчета"
      - "Интеграция с GitHub PR"

  - version: "1.1.0"
    date: "2026-01-15"
    changes:
      - "Поддержка TypeScript"
      - "Улучшенные примеры исправлений"

  - version: "1.0.0"
    date: "2026-01-10"
    changes:
      - "Первый релиз"
